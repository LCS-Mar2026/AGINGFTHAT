name: Publish 30 October glymphatic-sleep article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261030.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Assemble builder from public CDN parts
        run: |
          set -e
          : > scripts/parts30_joined.txt
          for u in \
            "https://cdn.marblism.com/HIvY3kYzGFj.txt" \
            "https://cdn.marblism.com/xzuRtLeQHH0.txt" \
            "https://cdn.marblism.com/Ii0ERnhqtA2.txt" \
            "https://cdn.marblism.com/KmeZdPyLZ2V.txt" \
            "https://cdn.marblism.com/M2zL-hdqGSw.txt" \
            "https://cdn.marblism.com/o9GSGh5fq7i.txt" \
            "https://cdn.marblism.com/jyty6148EwV.txt" \
            "https://cdn.marblism.com/bvN6UBW-mv6.txt" \
            "https://cdn.marblism.com/GYFPo1kkNwC.txt" ; do
            curl -sSL "$u" >> scripts/parts30_joined.txt
          done
          mkdir -p scripts/parts30
          cp scripts/parts30_joined.txt scripts/parts30/all.txt
          tr -d '\n' < scripts/parts30/all.txt | base64 -d > scripts/build_30.py
          python3 -c "import hashlib; d=open('scripts/build_30.py','rb').read(); print('assembled', len(d), hashlib.sha256(d).hexdigest()[:16]); assert len(d)>20000"
          python3 -c "import ast; ast.parse(open('scripts/build_30.py').read()); print('syntax ok')"
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_30.py 2>&1 | tee diag30.txt
      - name: Verify what was written
        run: |
          ls -l blog/glymphatic-system-brain-waste-clearance.html blog.html sitemap.xml blog/images/glymphatic-system-brain-waste-clearance.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/glymphatic-system-brain-waste-clearance.jpg','social/glymphatic-system-brain-waste-clearance.jpg','social/glymphatic-system-brain-waste-clearance-1080.jpg','social/glymphatic-system-brain-waste-clearance-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ scripts/parts30/ diag30.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 30 October glymphatic-sleep article with images [automated]"
          git pull --rebase --autostash origin main
          git push