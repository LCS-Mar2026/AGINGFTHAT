name: Publish 6 November protein hourglass article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261106.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Assemble builder from public CDN parts
        run: |
          set -e
          : > scripts/parts06_joined.txt
          for u in \
            "https://cdn.marblism.com/UwwXvtV9Hnh.txt" \
            "https://cdn.marblism.com/bJaArHMyjuk.txt" \
            "https://cdn.marblism.com/wqB7zE65xl6.txt" \
            "https://cdn.marblism.com/p4XyQsJDY0h.txt" \
            "https://cdn.marblism.com/iGJL1eYoje6.txt" \
            "https://cdn.marblism.com/DC9RnHTZl7u.txt" \
            "https://cdn.marblism.com/oJKpYEeUv2G.txt" \
            "https://cdn.marblism.com/l68gRXouHvl.txt" \
            "https://cdn.marblism.com/LTU5lIZ4DrF.txt" ; do
            curl -sSL "$u" >> scripts/parts06_joined.txt
          done
          mkdir -p scripts/parts06
          cp scripts/parts06_joined.txt scripts/parts06/all.txt
          tr -d '\n' < scripts/parts06/all.txt | base64 -d > scripts/build_06.py
          python3 -c "import hashlib; d=open('scripts/build_06.py','rb').read(); print('assembled', len(d), hashlib.sha256(d).hexdigest()[:16]); assert len(d)>20000"
          python3 -c "import ast; ast.parse(open('scripts/build_06.py').read()); print('syntax ok')"
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_06.py 2>&1 | tee diag06.txt
      - name: Verify what was written
        run: |
          ls -l blog/anabolic-resistance-muscle-protein-turnover.html blog.html sitemap.xml blog/images/anabolic-resistance-muscle-protein-turnover.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/anabolic-resistance-muscle-protein-turnover.jpg','social/anabolic-resistance-muscle-protein-turnover.jpg','social/anabolic-resistance-muscle-protein-turnover-1080.jpg','social/anabolic-resistance-muscle-protein-turnover-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ scripts/parts06/ diag06.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 6 November protein hourglass article with images [automated]"
          git pull --rebase --autostash origin main
          git push
