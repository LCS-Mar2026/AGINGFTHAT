name: blogfix5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogfix5.yml"

permissions:
  contents: write

jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSL https://cdn.marblism.com/ErpjXnOKPIK.html -o blog.html && curl -sSL https://cdn.marblism.com/5rg_ASp_7tJ.html -o blog/butyrate-fibre-biological-age.html && wc -c blog.html blog/butyrate-fibre-biological-age.html
      - run: git config user.email penny@agingfthat.com && git config user.name Penny && git add -A && git commit -m "Restore blog listing and article page" && git push
