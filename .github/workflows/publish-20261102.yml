name: Publish 2 November stress-apnea article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261102.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Assemble builder from public CDN parts
        run: |
          set -e
          : > scripts/parts01_joined.txt
          for u in \
            "https://cdn.marblism.com/aMFLgRUjHhb.txt" \
            "https://cdn.marblism.com/R5mrf-TQuQv.txt" \
            "https://cdn.marblism.com/xIYqVpKHfmK.txt" \
            "https://cdn.marblism.com/KlKw5Kla8R0.txt" \
            "https://cdn.marblism.com/Iwy5mJA1sJ3.txt" \
            "https://cdn.marblism.com/KyUEhYqjvlC.txt" ; do
            curl -sSL "$u" >> scripts/parts01_joined.txt
          done
          mkdir -p scripts/parts01
          cp scripts/parts01_joined.txt scripts/parts01/all.txt
          tr -d '\n' < scripts/parts01/all.txt | base64 -d > scripts/build_01.py
          python3 -c "import hashlib; d=open('scripts/build_01.py','rb').read(); print('assembled', len(d), hashlib.sha256(d).hexdigest()[:16]); assert len(d)>20000"
          python3 -c "import ast; ast.parse(open('scripts/build_01.py').read()); print('syntax ok')"
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_01.py 2>&1 | tee diag01.txt
      - name: Verify what was written
        run: |
          ls -l blog/stress-apnea-loop-cortisol-sleep.html blog.html sitemap.xml blog/images/stress-apnea-loop-cortisol-sleep.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/stress-apnea-loop-cortisol-sleep.jpg','social/stress-apnea-loop-cortisol-sleep.jpg','social/stress-apnea-loop-cortisol-sleep-1080.jpg','social/stress-apnea-loop-cortisol-sleep-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ scripts/parts01/ diag01.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 2 November stress-apnea article with images [automated]"
          git pull --rebase --autostash origin main
          git push
