name: Publish 24 Oct social connection article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261024.yml"
      - "scripts/build_24.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_24.py 2>&1 | tee diag24.txt
      - name: Verify what was written
        run: |
          ls -l blog/social-connection-dose-response-mortality.html blog/images/social-connection-dose-response-mortality.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/social-connection-dose-response-mortality.jpg','social/social-connection-dose-response-mortality.jpg','social/social-connection-dose-response-mortality-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ diag24.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 24 October social connection article with images [automated]"
          git push
