name: social16

on:
  push:
    branches: [main]
    paths:
      - "build_social.py"
      - "build_story.py"
      - ".github/workflows/social16.yml"

permissions:
  contents: write

jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Fetch today's artwork, font and render scripts
        run: |
          set -e
          curl -sSL -o /tmp/hero.webp https://cdn.marblism.com/V8p8BiAdbld.webp
          file /tmp/hero.webp
          curl -sSL -o /tmp/Montserrat.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf
      - name: Render POST and STORY
        run: |
          set -e
          python3 build_social.py 2>&1 | tee diag.txt
          python3 build_story.py 2>&1 | tee -a diag.txt
          ls -la social/
      - name: Commit and push
        run: |
          set -e
          git config user.email penny@agingfthat.com
          git config user.name Penny
          git add -A social/ diag.txt
          git commit -m "Social imagery for the 16 October sodium-to-potassium article [automated]"
          git push
