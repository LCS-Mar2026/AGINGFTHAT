name: Restore flexibility thumbnail 22 Oct

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fixthumb22.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow requests
      - name: Render the flexibility card thumbnail from verified artwork
        run: |
          echo '' | base64 -d > render_flex_thumb.py
          python3 render_flex_thumb.py
          file blog/images/flexibility-score-flexindex-healthspan.jpg
      - name: Commit the rebuilt thumbnail
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/images/flexibility-score-flexindex-healthspan.jpg render_flex_thumb.py
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Restore the flexibility card thumbnail from full artwork"
          git push
