name: blogfix2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSL -o blog.b64 https://cdn.marblism.com/ErpjXnOKPIK.html
      - run: python3 -c "import base64,pathlib;pathlib.Path('blog.html').write_bytes(base64.b64decode(pathlib.Path('blog.b64').read_text()));print('written')"
      - run: wc -c blog.html
      - run: git config user.email penny@agingfthat.com
      - run: git config user.name Penny
      - run: git add -A
      - run: git commit -m Restore blog listing
      - run: git push
