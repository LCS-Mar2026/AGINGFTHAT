name: Publish 7 November collagen turnover article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261107.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Assemble builder from public CDN parts
        run: |
          set -e
          : > scripts/parts07_joined.txt
          for u in \
            "https://cdn.marblism.com/QblAH-IhXX-.octet-stream" \
            "https://cdn.marblism.com/wBln_Ol96La.octet-stream" \
            "https://cdn.marblism.com/-ik0LXNizQG.octet-stream" \
            "https://cdn.marblism.com/MCYfLsVk0r6.octet-stream" \
            "https://cdn.marblism.com/4wslJcNfLrj.octet-stream" \
            "https://cdn.marblism.com/rRcdRfuVmbQ.octet-stream" \
            "https://cdn.marblism.com/br7aTyZFEtT.octet-stream" \
            "https://cdn.marblism.com/cjgVNot3nKQ.octet-stream" \
            "https://cdn.marblism.com/L3x81qMi634.octet-stream" \
            "https://cdn.marblism.com/ORl0300cClo.octet-stream" ; do
            curl -sSL "$u" >> scripts/parts07_joined.txt
          done
          mkdir -p scripts/parts07
          cp scripts/parts07_joined.txt scripts/parts07/all.txt
          tr -d '\n' < scripts/parts07/all.txt | base64 -d > scripts/build_07.py
          python3 -c "import hashlib; d=open('scripts/build_07.py','rb').read(); print('assembled', len(d), hashlib.sha256(d).hexdigest()[:16]); assert len(d)>20000"
          python3 -c "import ast; ast.parse(open('scripts/build_07.py').read()); print('syntax ok')"
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_07.py 2>&1 | tee diag07.txt
      - name: Verify what was written
        run: |
          ls -l blog/collagen-turnover-markers-training-response.html blog.html sitemap.xml blog/images/collagen-turnover-markers-training-response.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/collagen-turnover-markers-training-response.jpg','social/collagen-turnover-markers-training-response.jpg','social/collagen-turnover-markers-training-response-1080.jpg','social/collagen-turnover-markers-training-response-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ scripts/parts07/ diag07.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 7 November collagen turnover article with images [automated]"
          git pull --rebase --autostash origin main
          git push
