name: 1080 delivery size for 23 Oct post

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/social1080-23.yml"
      - "scripts/make1080_23.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Build the 1080x1350 file and whitelist it
        run: |
          python3 scripts/make1080_23.py
          python3 scripts/build_public.py | tail -2
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A social/ scripts/build_public.py
          git diff --cached --quiet && echo none || git commit -m "Add the 1080x1350 delivery size for the 23 October post [automated]"
          git push
