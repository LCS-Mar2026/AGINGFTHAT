name: Publish 26 Oct brown-fat article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261026.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Assemble builder from public CDN parts
        run: |
          set -e
          : > scripts/parts26_joined.txt
          for u in \
            "https://cdn.marblism.com/2_SouE-iWl3.txt" \
            "https://cdn.marblism.com/fwZ39CwD30M.txt" \
            "https://cdn.marblism.com/0e3N5g3Cw0j.txt" \
            "https://cdn.marblism.com/m6IBJVXEnS_.txt" ; do
            curl -sSL "$u" >> scripts/parts26_joined.txt
          done
          mkdir -p scripts/parts26
          cp scripts/parts26_joined.txt scripts/parts26/all.txt
          tr -d '\n' < scripts/parts26/all.txt | base64 -d > scripts/build_26.py
          python3 -c "import hashlib; d=open('scripts/build_26.py','rb').read(); print('assembled', len(d), hashlib.sha256(d).hexdigest()[:16]); assert len(d)>20000"
          python3 -c "import ast; ast.parse(open('scripts/build_26.py').read()); print('syntax ok')"
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_26.py 2>&1 | tee diag26.txt
      - name: Verify what was written
        run: |
          ls -l blog/cold-exposure-brown-fat-thermogenesis.html blog.html sitemap.xml blog/images/cold-exposure-brown-fat-thermogenesis.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/cold-exposure-brown-fat-thermogenesis.jpg','social/cold-exposure-brown-fat-thermogenesis.jpg','social/cold-exposure-brown-fat-thermogenesis-1080.jpg','social/cold-exposure-brown-fat-thermogenesis-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ scripts/parts26/ diag26.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 26 October brown-fat article with images [automated]"
          git push
