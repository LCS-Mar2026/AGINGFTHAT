name: Build daily Instagram post

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build_social.py', '.github/workflows/social-post.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Fetch assets and diagnose
        run: |
          {
            echo "== artwork =="
            curl -sSL -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" -o /tmp/art.webp -w "http=%{http_code} bytes=%{size_download}\n" "https://cdn.marblism.com/E-n_qZpqlk3.webp" || echo "art fetch FAILED"
            file /tmp/art.webp 2>&1
            echo "== font =="
            curl -sSL -o /tmp/Montserrat.ttf -w "http=%{http_code} bytes=%{size_download}\n" "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" || echo "font fetch FAILED"
            file /tmp/Montserrat.ttf 2>&1
            echo "== repo =="
            ls -la
            echo "== render =="
            python3 build_social.py 2>&1 || echo "RENDER FAILED"
            echo "== result =="
            ls -la social/
          } > diag.txt 2>&1
          cat diag.txt
      - name: Publish graphic and diagnostics
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A social/ diag.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Add 7 Oct Instagram post graphic [automated]"
          git push
