name: Build daily Instagram post

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build_social.py', 'build_story.py', '.github/workflows/social-post.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Fetch assets and render
        run: |
          {
            echo "== artifacts =="
            curl -sSL -o /tmp/art.webp -w "square http=%{http_code} bytes=%{size_download}\n" "https://cdn.marblism.com/E-n_qZpqlk3.webp" || echo "square fetch FAILED"
            curl -sSL -o /tmp/art-story.webp -w "story http=%{http_code} bytes=%{size_download}\n" "https://cdn.marblism.com/EsJL0vHWYEe.webp" || echo "story fetch FAILED"
            file /tmp/art.webp /tmp/art-story.webp 2>&1
            echo "== font =="
            curl -sSL -o /tmp/Montserrat.ttf -w "font http=%{http_code} bytes=%{size_download}\n" "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" || echo "font fetch FAILED"
            echo "== render =="
            python3 build_social.py 2>&1 || echo "RENDER FAILED"
            python3 build_story.py 2>&1 || echo "STORY FAILED"
            echo "== result =="
            ls -la social/
          } > diag.txt 2>&1
          cat diag.txt
      - name: Publish graphics and diagnostics
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A social/ diag.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Add 7 Oct Instagram post and story graphics [automated]"
          git push
