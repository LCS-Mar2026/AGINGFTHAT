name: Publish 23 Oct twenty-minute dose article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261023.yml"
      - "scripts/build_23.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_23.py 2>&1 | tee diag23.txt
      - name: Verify what was written
        run: |
          ls -l blog/twenty-minute-dose-nature-cortisol.html blog/images/twenty-minute-dose-nature-cortisol.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/twenty-minute-dose-nature-cortisol.jpg','social/twenty-minute-dose-nature-cortisol.jpg','social/twenty-minute-dose-nature-cortisol-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ diag23.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 23 October twenty-minute dose article with images [automated]"
          git push
