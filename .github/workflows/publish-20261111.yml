name: Publish 11 November deliberate heat article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261111.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Assemble builder from public CDN parts
        run: |
          set -e
          : > scripts/parts11_joined.txt
          for u in \
            "https://cdn.marblism.com/5mun1YmT_rL.octet-stream" \
            "https://cdn.marblism.com/H3aWrr2fgf9.octet-stream" \
            "https://cdn.marblism.com/GQalReDWe1Z.octet-stream" \
            "https://cdn.marblism.com/e_G4cvG19hG.octet-stream" \
            "https://cdn.marblism.com/YpBVBpNHUlu.octet-stream" \
            "https://cdn.marblism.com/xx2hDujFxBz.octet-stream" \
            "https://cdn.marblism.com/4QATAOfNt5n.octet-stream" \
            "https://cdn.marblism.com/WdrINOOqrsd.octet-stream" \
            "https://cdn.marblism.com/e3tXKY1ACyN.octet-stream" \
            "https://cdn.marblism.com/vfeRezHiKX6.octet-stream" ; do
            curl -sSL "$u" >> scripts/parts11_joined.txt
          done
          mkdir -p scripts/parts11
          cp scripts/parts11_joined.txt scripts/parts11/all.txt
          tr -d '\n' < scripts/parts11/all.txt | base64 -d > scripts/build_11.py
          python3 -c "import hashlib; d=open('scripts/build_11.py','rb').read(); print('assembled', len(d), hashlib.sha256(d).hexdigest()[:16]); assert len(d)>20000"
          python3 -c "import ast; ast.parse(open('scripts/build_11.py').read()); print('syntax ok')"
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_11.py 2>&1 | tee diag11.txt
      - name: Verify what was written
        run: |
          ls -l blog/deliberate-heat-exposure-hsp-finnish-sauna.html blog.html sitemap.xml blog/images/deliberate-heat-exposure-hsp-finnish-sauna.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/deliberate-heat-exposure-hsp-finnish-sauna.jpg','social/deliberate-heat-exposure-hsp-finnish-sauna.jpg','social/deliberate-heat-exposure-hsp-finnish-sauna-1080.jpg','social/deliberate-heat-exposure-hsp-finnish-sauna-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ scripts/parts11/ diag11.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 11 November deliberate heat article with images [automated]"
          git pull --rebase --autostash origin main
          git push
