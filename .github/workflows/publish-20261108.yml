name: Publish 8 November bone endocrine organ article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261108.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Assemble builder from public CDN parts
        run: |
          set -e
          : > scripts/parts09_joined.txt
          for u in \
            "https://cdn.marblism.com/vZ2mZJqkebD.octet-stream" \
            "https://cdn.marblism.com/XRePwe_3a3q.octet-stream" \
            "https://cdn.marblism.com/O5jzjPFNWCb.octet-stream" \
            "https://cdn.marblism.com/YpBpE60Y14C.octet-stream" \
            "https://cdn.marblism.com/pr4ew4w6QUf.octet-stream" \
            "https://cdn.marblism.com/JRZCI2CZY0H.octet-stream" \
            "https://cdn.marblism.com/bQ5w0suEk-a.octet-stream" \
            "https://cdn.marblism.com/98BMNkvBMv7.octet-stream" \
            "https://cdn.marblism.com/KoKiJiYXkDs.octet-stream" \
            "https://cdn.marblism.com/g1yJ31UWLu1.octet-stream" ; do
            curl -sSL "$u" >> scripts/parts09_joined.txt
          done
          mkdir -p scripts/parts09
          cp scripts/parts09_joined.txt scripts/parts09/all.txt
          tr -d '\n' < scripts/parts09/all.txt | base64 -d > scripts/build_09.py
          python3 -c "import hashlib; d=open('scripts/build_09.py','rb').read(); print('assembled', len(d), hashlib.sha256(d).hexdigest()[:16]); assert len(d)>20000"
          python3 -c "import ast; ast.parse(open('scripts/build_09.py').read()); print('syntax ok')"
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_09.py 2>&1 | tee diag09.txt
      - name: Verify what was written
        run: |
          ls -l blog/bone-endocrine-organ-osteocalcin-brain-muscle.html blog.html sitemap.xml blog/images/bone-endocrine-organ-osteocalcin-brain-muscle.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/bone-endocrine-organ-osteocalcin-brain-muscle.jpg','social/bone-endocrine-organ-osteocalcin-brain-muscle.jpg','social/bone-endocrine-organ-osteocalcin-brain-muscle-1080.jpg','social/bone-endocrine-organ-osteocalcin-brain-muscle-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ scripts/parts09/ diag09.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 8 November bone endocrine organ article with images [automated]"
          git pull --rebase --autostash origin main
          git push
