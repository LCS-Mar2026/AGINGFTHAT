name: Fix blog card thumbnails 19 Oct

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fixthumbs19.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow requests
      - name: Write generator script and run it
        run: |
          echo '' | base64 -d > gen_thumbs.py
          python3 gen_thumbs.py
      - name: Commit thumbnails
        run: |
          set -e
          git config user.email penny@agingfthat.com
          git config user.name Penny
          git add -A blog/images/creatine-brain-phosphate-buffer.jpg blog/images/multivitamin-myth-blood-test-first.jpg gen_thumbs.py
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Fix creatine and multivitamin card thumbnails via CI generator"
          git push
