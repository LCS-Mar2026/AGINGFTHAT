name: Fix blog card thumbnails 19 Oct

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fixthumbs19.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch artwork and convert to card thumbnails
        run: |
          set -e
          curl -sSL https://cdn.marblism.com/VCezZc1RB9N.webp -o /tmp/creatine.webp
          file /tmp/creatine.webp
          convert /tmp/creatine.webp -resize 1200x -quality 92 blog/images/creatine-brain-phosphate-buffer.jpg
          file blog/images/creatine-brain-phosphate-buffer.jpg
          curl -sSL https://cdn.marblism.com/KwizQuc3ZPz.webp -o /tmp/multivit.webp
          file /tmp/multivit.webp
          convert /tmp/multivit.webp -resize 1200x -quality 92 blog/images/multivitamin-myth-blood-test-first.jpg
          file blog/images/multivitamin-myth-blood-test-first.jpg
      - name: Commit thumbnails
        run: |
          set -e
          git config user.email penny@agingfthat.com
          git config user.name Penny
          git add -A blog/images/creatine-brain-phosphate-buffer.jpg blog/images/multivitamin-myth-blood-test-first.jpg
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Fix creatine and multivitamin card thumbnails via CI"
          git push
