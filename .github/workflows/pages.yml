name: Deploy public marketing site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'Pillow>=11,<13'
      - run: python3 build_dashboard.py
      - run: python3 scripts/build_public.py
      - name: Preserve imported artwork in the website repository
        run: |
          git config user.name "AFT website publisher"
          git config user.email "penny@agingfthat.com"
          git add -- '*.html' '*.css' assets/site-images
          if ! git diff --cached --quiet; then
            git commit -m "Store verified website artwork on AFT hosting"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
