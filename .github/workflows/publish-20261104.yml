name: Publish 4 November proprioception article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261104.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Assemble builder from public CDN parts
        run: |
          set -e
          : > scripts/parts02_joined.txt
          for u in \
            "https://cdn.marblism.com/bivmq6btR3p.txt" \
            "https://cdn.marblism.com/gjqbtkWgz8V.txt" \
            "https://cdn.marblism.com/sBxrME_BjpA.txt" \
            "https://cdn.marblism.com/3GN7UB_8RgT.txt" \
            "https://cdn.marblism.com/5znM8cM1ysf.txt" \
            "https://cdn.marblism.com/CQ11OXdlpWZ.txt" \
            "https://cdn.marblism.com/hE5VLInuhkA.txt" \
            "https://cdn.marblism.com/2Q0T2l3xFwV.txt" \
            "https://cdn.marblism.com/ItFIOU_kl5V.txt" \
            "https://cdn.marblism.com/EXmUZZdgSAA.txt" ; do
            curl -sSL "$u" >> scripts/parts02_joined.txt
          done
          mkdir -p scripts/parts02
          cp scripts/parts02_joined.txt scripts/parts02/all.txt
          tr -d '\n' < scripts/parts02/all.txt | base64 -d > scripts/build_02.py
          python3 -c "import hashlib; d=open('scripts/build_02.py','rb').read(); print('assembled', len(d), hashlib.sha256(d).hexdigest()[:16]); assert len(d)>20000"
          python3 -c "import ast; ast.parse(open('scripts/build_02.py').read()); print('syntax ok')"
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_02.py 2>&1 | tee diag02.txt
      - name: Verify what was written
        run: |
          ls -l blog/proprioception-joint-position-sense-brain-aging.html blog.html sitemap.xml blog/images/proprioception-joint-position-sense-brain-aging.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/proprioception-joint-position-sense-brain-aging.jpg','social/proprioception-joint-position-sense-brain-aging.jpg','social/proprioception-joint-position-sense-brain-aging-1080.jpg','social/proprioception-joint-position-sense-brain-aging-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ scripts/parts02/ diag02.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 4 November proprioception article with images [automated]"
          git pull --rebase --autostash origin main
          git push
