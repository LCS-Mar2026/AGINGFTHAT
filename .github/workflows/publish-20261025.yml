name: Publish 25 Oct consistency article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20261025.yml"
      - "scripts/parts25/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Assemble builder from parts
        run: |
          cat scripts/parts25/part1.txt scripts/parts25/part2.txt scripts/parts25/part3.txt scripts/parts25/part4.txt | tr -d '\n' | base64 -d > scripts/build_25.py
          python3 -c "import hashlib; d=open('scripts/build_25.py','rb').read(); print('assembled', len(d), hashlib.sha256(d).hexdigest()[:16]); assert len(d)>20000"
      - name: Build page, listing card, sitemap entry and images
        run: |
          python3 scripts/build_25.py 2>&1 | tee diag25.txt
      - name: Verify what was written
        run: |
          ls -l blog/consistency-muscle-memory-bridging-days.html blog.html sitemap.xml blog/images/consistency-muscle-memory-bridging-days.jpg social/
          python3 -c "from PIL import Image; [print(p, Image.open(p).size) for p in ['blog/images/consistency-muscle-memory-bridging-days.jpg','social/consistency-muscle-memory-bridging-days.jpg','social/consistency-muscle-memory-bridging-days-1080.jpg','social/consistency-muscle-memory-bridging-days-story.jpg']]"
      - name: Commit
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/ blog.html sitemap.xml social/ diag25.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Publish the 25 October consistency article with images [automated]"
          git push
