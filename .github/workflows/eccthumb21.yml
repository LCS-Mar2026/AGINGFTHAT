name: Rebuild eccentric thumbnail 21 Oct

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eccthumb21.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow requests
      - name: Render the eccentric thumbnail from the day's fresh artwork
        run: |
          echo '' | base64 -d > render_ecc_thumb.py
          python3 render_ecc_thumb.py
          file blog/images/eccentric-lowering-strength-training-over-50.jpg
      - name: Commit the rebuilt thumbnail
        run: |
          set -e
          git config user.name "Penny (Blog Writer)"
          git config user.email "penny@agingfthat.com"
          git add -A blog/images/eccentric-lowering-strength-training-over-50.jpg render_ecc_thumb.py
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Rebuild the eccentric lowering card thumbnail from full artwork"
          git push
