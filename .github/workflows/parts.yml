name: parts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSL -o p1.b64 https://cdn.marblism.com/xwjT1DYYBLD.b64
      - run: curl -sSL -o p2.b64 https://cdn.marblism.com/mBKqbyxckps.b64
      - run: curl -sSL -o dash.b64 https://cdn.marblism.com/U1NPTsYPOcM.b64
      - run: curl -sSL -o ex.b64 https://cdn.marblism.com/HMEzqa86Mxn.b64
      - run: curl -sSL -o css.b64 https://cdn.marblism.com/e-BkiPk_S4v.b64
      - run: python3 scripts/decode_parts.py
      - run: cat dashboard_src/gen_p1.txt dashboard_src/gen_p2.txt > dashboard_src/gen.py
      - run: wc -c dashboard_src/gen.py dashboard.html example-report.html dashboard_src/css.py
      - run: git config user.email penny@agingfthat.com
      - run: git config user.name Penny
      - run: git add -A
      - run: git commit -m Restored-generator-and-pages
      - run: git push
